<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>
        Local Community Event Portal
    </title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: darkblue;
            margin-bottom: 20px;
        }

        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        input,
        select,
        button {
            padding: 10px;
        }

        #eventsContainer {
            display: grid;
            grid-template-columns: repeat(auto-fit,
                    minmax(250px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .event-card {
            background: white;
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #ccc;
        }

        .event-card h3 {
            color: darkblue;
        }

        .event-card button {
            margin-top: 10px;
            background: green;
            color: white;
            border: none;
            cursor: pointer;
        }

        .event-card button:hover {
            background: darkgreen;
        }

        form {
            background: white;
            padding: 20px;
            margin-top: 30px;
            border-radius: 10px;
        }

        form input,
        form select {
            width: 100%;
            margin-bottom: 10px;
        }

        #error {
            color: red;
            font-weight: bold;
        }

        #success {
            color: green;
            font-weight: bold;
        }

        #spinner {
            display: none;
            color: blue;
            font-weight: bold;
            margin-top: 15px;
        }

        .hidden {
            display: none;
        }
    </style>

</head>

<body>

    <h1>
        Local Community Event Portal
    </h1>

    <!-- Task 8 -->
    <div class="controls">

        <input type="text"
            id="searchInput"
            placeholder="Search Event">

        <select id="categoryFilter">

            <option value="All">
                All Categories
            </option>

            <option value="Music">
                Music
            </option>

            <option value="Workshop">
                Workshop
            </option>

            <option value="Technology">
                Technology
            </option>

        </select>

    </div>

    <!-- Loading Spinner -->

    <div id="spinner">
        Loading Events...
    </div>

    <!-- Events -->

    <div id="eventsContainer">

    </div>

    <!-- Registration Form -->

    <form id="registerForm">

        <h2>
            Event Registration
        </h2>

        <br>

        <input type="text"
            name="name"
            placeholder="Enter Name">

        <input type="email"
            name="email"
            placeholder="Enter Email">

        <select name="event">

            <option value="">
                Select Event
            </option>

            <option>
                Music Festival
            </option>

            <option>
                Baking Workshop
            </option>

            <option>
                Tech Meetup
            </option>

        </select>

        <button type="submit"
            id="registerBtn">

            Register

        </button>

        <p id="error"></p>

        <p id="success"></p>

    </form>

    <!-- jQuery CDN -->

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <!-- External JS -->

    <script src="main.js"></script>

</body>

</html>
